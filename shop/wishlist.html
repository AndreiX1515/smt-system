<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist | Shop</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .wishlist-list { padding: 16px 20px; }

        .wishlist-item {
            display: flex;
            gap: 12px;
            padding: 16px 0;
            border-bottom: 1px solid #eee;
            position: relative;
        }
        .wishlist-item-img {
            width: 80px;
            height: 80px;
            background: #f5f5f5;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .wishlist-item-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
        .wishlist-item-info { flex: 1; cursor: pointer; }
        .wishlist-item-category { font-size: 12px; color: #888; margin-bottom: 4px; }
        .wishlist-item-name { font-size: 14px; font-weight: 500; margin-bottom: 6px; line-height: 1.4; }
        .wishlist-item-price { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        .wishlist-item-price .original {
            font-size: 13px;
            color: #999;
            text-decoration: line-through;
            margin-right: 4px;
            font-weight: 400;
        }
        .wishlist-item-price .sale { color: #e74c3c; }

        .wishlist-item-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn-add-cart {
            padding: 8px 16px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-add-cart:hover { background: #333; }
        .btn-add-cart:disabled { background: #ccc; cursor: not-allowed; }
        .btn-remove {
            padding: 8px 12px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 6px;
            font-size: 12px;
            color: #888;
            cursor: pointer;
        }
        .btn-remove:hover { background: #f5f5f5; }

        .stock-label {
            font-size: 12px;
            color: #e74c3c;
            margin-top: 4px;
        }

        .empty-wishlist {
            text-align: center;
            padding: 80px 20px;
            color: #888;
        }
        .empty-wishlist-icon { font-size: 64px; margin-bottom: 16px; }
        .empty-wishlist a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #000;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
        }

        .login-required {
            text-align: center;
            padding: 80px 20px;
            color: #888;
        }
        .login-required-icon { font-size: 64px; margin-bottom: 16px; }
        .login-required a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #000;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            display: none;
            z-index: 1000;
        }
        .toast.show { display: block; animation: fadeInOut 2s ease; }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        .badge-featured {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="main">
        <header class="header-type1">
            <a class="btn-mypage" href="index.html"><img src="/images/ico_arrow_left.svg"></a>
            <div class="title">Wishlist</div>
            <div style="width: 24px;"></div>
        </header>

        <div class="wishlist-list" id="wishlistContainer">
            <!-- 로딩 중 -->
        </div>

        <div class="toast" id="toast"></div>
    </div>

    <script>
        const API_BASE = '/backend/api/shop';

        let wishlistItems = [];
        let isLoggedIn = false;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // 로그인 상태 확인
        async function checkLogin() {
            try {
                const res = await fetch('/backend/api/check-session.php', {
                    credentials: 'include'
                });
                const data = await res.json();
                isLoggedIn = data.isLoggedIn === true;
                return isLoggedIn;
            } catch (e) {
                console.error(e);
                return false;
            }
        }

        async function loadWishlist() {
            const loggedIn = await checkLogin();

            if (!loggedIn) {
                showLoginRequired();
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/wishlist.php`, {
                    credentials: 'include'
                });
                const data = await res.json();

                if (data.success) {
                    wishlistItems = data.items;
                    if (wishlistItems.length > 0) {
                        renderWishlist();
                    } else {
                        showEmpty();
                    }
                } else if (data.requireLogin) {
                    showLoginRequired();
                }
            } catch (e) {
                console.error(e);
            }
        }

        function showLoginRequired() {
            document.getElementById('wishlistContainer').innerHTML = `
                <div class="login-required">
                    <div class="login-required-icon">🔒</div>
                    <div>Please log in to view your wishlist</div>
                    <a href="/user/login.html?redirect=${encodeURIComponent(location.href)}">Login</a>
                </div>
            `;
        }

        function showEmpty() {
            document.getElementById('wishlistContainer').innerHTML = `
                <div class="empty-wishlist">
                    <div class="empty-wishlist-icon">♡</div>
                    <div>Your wishlist is empty</div>
                    <a href="index.html">Browse Products</a>
                </div>
            `;
        }

        function renderWishlist() {
            const container = document.getElementById('wishlistContainer');
            container.innerHTML = wishlistItems.map(item => {
                const price = item.sale_price || item.price;
                const outOfStock = item.stock <= 0;
                return `
                <div class="wishlist-item" data-product-id="${item.product_id}">
                    <div class="wishlist-item-img" onclick="goToProduct(${item.product_id})">
                        ${item.thumbnail
                            ? `<img src="${item.thumbnail}" alt="${item.name}">`
                            : '📦'}
                    </div>
                    <div class="wishlist-item-info" onclick="goToProduct(${item.product_id})">
                        <div class="wishlist-item-category">
                            ${item.category_name || ''}
                            ${item.is_featured == 1 ? '<span class="badge-featured">추천</span>' : ''}
                        </div>
                        <div class="wishlist-item-name">${item.name}</div>
                        <div class="wishlist-item-price">
                            ${item.sale_price
                                ? `<span class="original">₱${Number(item.price).toLocaleString()}</span>
                                   <span class="sale">₱${Number(item.sale_price).toLocaleString()}</span>`
                                : `₱${Number(item.price).toLocaleString()}`}
                        </div>
                        ${outOfStock ? '<div class="stock-label">Out of Stock</div>' : ''}
                    </div>
                    <div class="wishlist-item-actions">
                        <button class="btn-add-cart" onclick="addToCart(${item.product_id})" ${outOfStock ? 'disabled' : ''}>
                            Add to Cart
                        </button>
                        <button class="btn-remove" onclick="removeFromWishlist(${item.product_id})">Remove</button>
                    </div>
                </div>
                `;
            }).join('');
        }

        function goToProduct(productId) {
            location.href = `product.html?id=${productId}`;
        }

        async function addToCart(productId) {
            try {
                const res = await fetch(`${API_BASE}/cart.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        product_id: productId,
                        quantity: 1
                    })
                });
                const data = await res.json();

                if (data.success) {
                    showToast('Added to cart');
                } else if (data.requireLogin) {
                    location.href = `/user/login.html?redirect=${encodeURIComponent(location.href)}`;
                } else {
                    alert(data.error || 'Failed to add to cart');
                }
            } catch (e) {
                console.error(e);
                alert('An error occurred.');
            }
        }

        async function removeFromWishlist(productId) {
            try {
                const res = await fetch(`${API_BASE}/wishlist.php?product_id=${productId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                const data = await res.json();

                if (data.success) {
                    showToast('Removed from wishlist');
                    loadWishlist();
                }
            } catch (e) {
                console.error(e);
            }
        }

        loadWishlist();
    </script>
</body>
</html>
