<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>Menu Permission - SMART TRAVEL ADMIN</title>

	<link rel="shortcut icon" href="../image/favicon.ico">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../css/a_reset.css">
	<link rel="stylesheet" href="../css/a_variables.css">
	<link rel="stylesheet" href="../css/a_components.css">
	<link rel="stylesheet" href="../css/a_contents.css">
	<style>
		.permission-table {
			width: 100%;
			border-collapse: collapse;
			margin-top: 20px;
		}
		.permission-table th,
		.permission-table td {
			border: 1px solid #e0e0e0;
			padding: 12px 16px;
			text-align: left;
		}
		.permission-table th {
			background: #f5f5f5;
			font-weight: 600;
		}
		.permission-table tr:hover {
			background: #fafafa;
		}
		.permission-table .menu-parent {
			font-weight: 600;
			background: #f9f9f9;
		}
		.permission-table .menu-child {
			padding-left: 40px;
		}
		.permission-table .checkbox-cell {
			text-align: center;
			width: 120px;
		}
		.permission-table input[type="checkbox"] {
			width: 18px;
			height: 18px;
			cursor: pointer;
		}
		.role-header {
			text-align: center !important;
		}
		.save-btn-wrap {
			margin-top: 24px;
			display: flex;
			justify-content: flex-end;
			gap: 12px;
		}
		.alert-box {
			padding: 16px;
			border-radius: 8px;
			margin-bottom: 20px;
		}
		.alert-box.info {
			background: #e3f2fd;
			color: #1565c0;
		}
		.alert-box.warning {
			background: #fff3e0;
			color: #e65100;
		}
		.loading-overlay {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: rgba(255,255,255,0.8);
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 9999;
		}
		.loading-overlay.hidden {
			display: none;
		}
	</style>
</head>

<body>
	<header class="layout-header"></header>

	<main class="layout-main">
		<nav class="layout-nav"></nav>

		<section class="layout-content">
			<h1 class="page-title" data-lan-eng="Menu Permission Management">Menu Permission Management</h1>

			<div class="alert-box info">
				<strong>Info:</strong> Configure which menus each admin role can access. Changes take effect immediately after saving.
			</div>

			<div class="card-panel jw-mgt24">
				<div id="permissionTableWrap">
					<p style="padding: 40px; text-align: center; color: #999;">Loading...</p>
				</div>

				<div class="save-btn-wrap">
					<button type="button" class="jw-button typeB" onclick="resetPermissions()">Reset</button>
					<button type="button" class="jw-button typeA" onclick="savePermissions()">Save Changes</button>
				</div>
			</div>
		</section>
	</main>

	<div id="loadingOverlay" class="loading-overlay hidden">
		<div>Saving...</div>
	</div>

	<script src="../js/default.js"></script>
	<script src="../js/super.js"></script>
	<script>
		let originalPermissions = {};
		let currentPermissions = {};
		let menus = [];
		const roles = ['admin_ph', 'admin_kr'];

		document.addEventListener('DOMContentLoaded', () => {
			init({
				headerUrl: '../inc/header.html',
				navUrl: '../inc/nav_super.html'
			});
			loadPermissions();
		});

		async function loadPermissions() {
			try {
				const response = await fetch('../backend/api/menu-api.php?action=getPermissions', {
					credentials: 'same-origin'
				});
				const data = await response.json();

				if (!data.success) {
					throw new Error(data.message || 'Failed to load permissions');
				}

				menus = data.menus;
				originalPermissions = JSON.parse(JSON.stringify(data.permissions));
				currentPermissions = JSON.parse(JSON.stringify(data.permissions));

				renderPermissionTable();
			} catch (error) {
				console.error('Error loading permissions:', error);
				document.getElementById('permissionTableWrap').innerHTML =
					'<p style="padding: 40px; text-align: center; color: #d32f2f;">Error: ' + error.message + '</p>';
			}
		}

		function renderPermissionTable() {
			// 메뉴를 부모-자식 구조로 그룹화
			const parentMenus = menus.filter(m => !m.parent_menu_id);
			const childMenusMap = {};
			menus.forEach(m => {
				if (m.parent_menu_id) {
					if (!childMenusMap[m.parent_menu_id]) childMenusMap[m.parent_menu_id] = [];
					childMenusMap[m.parent_menu_id].push(m);
				}
			});

			let html = `
				<table class="permission-table">
					<thead>
						<tr>
							<th style="width: 300px;">Menu</th>
							<th class="role-header">Admin (PH)</th>
							<th class="role-header">Admin (KR)</th>
						</tr>
					</thead>
					<tbody>
			`;

			parentMenus.forEach(parent => {
				// 부모 메뉴 행
				html += `
					<tr class="menu-parent">
						<td>${parent.menu_name_en || parent.menu_name}</td>
						${roles.map(role => `
							<td class="checkbox-cell">
								<input type="checkbox"
									data-menu="${parent.menu_id}"
									data-role="${role}"
									${currentPermissions[role]?.[parent.menu_id] ? 'checked' : ''}
									onchange="togglePermission('${parent.menu_id}', '${role}', this.checked, true)">
							</td>
						`).join('')}
					</tr>
				`;

				// 자식 메뉴 행들
				const children = childMenusMap[parent.menu_id] || [];
				children.forEach(child => {
					const isMenuPermission = child.menu_id === 'menu-permission';
					html += `
						<tr>
							<td class="menu-child">${child.menu_name_en || child.menu_name}</td>
							${roles.map(role => {
								const isDisabled = isMenuPermission && role === 'admin_kr';
								const isChecked = currentPermissions[role]?.[child.menu_id];
								return `
									<td class="checkbox-cell">
										<input type="checkbox"
											data-menu="${child.menu_id}"
											data-role="${role}"
											${isChecked ? 'checked' : ''}
											${isDisabled ? 'disabled title="admin_kr must always have access to Menu Permission"' : ''}
											onchange="togglePermission('${child.menu_id}', '${role}', this.checked, false)">
									</td>
								`;
							}).join('')}
						</tr>
					`;
				});
			});

			html += `
					</tbody>
				</table>
			`;

			document.getElementById('permissionTableWrap').innerHTML = html;
		}

		function togglePermission(menuId, role, checked, isParent) {
			if (!currentPermissions[role]) currentPermissions[role] = {};
			currentPermissions[role][menuId] = checked ? 1 : 0;

			// 부모 메뉴 체크 시 자식 메뉴도 같이 변경
			if (isParent) {
				const children = menus.filter(m => m.parent_menu_id === menuId);
				children.forEach(child => {
					// menu-permission은 admin_kr에서 항상 활성화
					if (child.menu_id === 'menu-permission' && role === 'admin_kr') return;

					currentPermissions[role][child.menu_id] = checked ? 1 : 0;
					const checkbox = document.querySelector(`input[data-menu="${child.menu_id}"][data-role="${role}"]`);
					if (checkbox && !checkbox.disabled) checkbox.checked = checked;
				});
			}
		}

		function resetPermissions() {
			currentPermissions = JSON.parse(JSON.stringify(originalPermissions));
			renderPermissionTable();
		}

		async function savePermissions() {
			const overlay = document.getElementById('loadingOverlay');
			overlay.classList.remove('hidden');

			try {
				const response = await fetch('../backend/api/menu-api.php?action=savePermissions', {
					method: 'POST',
					credentials: 'same-origin',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify({ permissions: currentPermissions })
				});

				const data = await response.json();

				if (!data.success) {
					throw new Error(data.message || 'Failed to save permissions');
				}

				originalPermissions = JSON.parse(JSON.stringify(currentPermissions));
				alert('Permissions saved successfully!');

				// 현재 페이지 새로고침하여 변경사항 반영
				location.reload();
			} catch (error) {
				console.error('Error saving permissions:', error);
				alert('Error: ' + error.message);
			} finally {
				overlay.classList.add('hidden');
			}
		}
	</script>
</body>
</html>
