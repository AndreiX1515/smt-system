<!-- ==============================================
   Traveler View Modal - 공통 모달 (보기 전용)
   이 파일은 여러 페이지에서 공유됩니다.
   수정 시 모든 페이지에 영향을 미칩니다.
   - reservation-detail.html
   - b2b-booking-detail.html
   ============================================== -->

<!-- 여행자 상세 보기 모달 (View Only) -->
<div id="travelerDetailModal" class="modal" style="display:none;">
	<div class="modal-content modal-traveler-view">
		<div class="modal-header">
			<h3 data-lan-eng="Traveler Information">Traveler Information</h3>
			<button type="button" class="modal-close" onclick="closeTravelerModal()">
				<img src="../image/button-close2.svg" alt="">
			</button>
		</div>
		<div class="modal-body traveler-view-modal-body">
			<!-- 왼쪽: 여행자 카드 영역 -->
			<div class="traveler-view-modal-main">
				<div class="traveler-cards-header">
					<span class="traveler-count" id="traveler-view-count">0 Travelers</span>
				</div>
				<div class="traveler-cards-container" id="traveler-view-cards-container">
					<!-- 여행자 카드가 여기에 동적으로 추가됩니다 -->
				</div>
			</div>
			<!-- 오른쪽: 네비게이션 사이드바 -->
			<div class="traveler-view-modal-sidebar" id="traveler-view-modal-sidebar">
				<div class="sidebar-title" data-lan-eng="Travelers">Travelers</div>
				<div class="sidebar-nav-list" id="traveler-view-sidebar-nav">
					<!-- 여행자 네비게이션 아이템이 여기에 추가됩니다 -->
				</div>
			</div>
		</div>
		<div class="modal-footer">
			<button type="button" class="jw-button typeD" onclick="closeTravelerModal()" data-lan-eng="Close">Close</button>
		</div>
	</div>
</div>
