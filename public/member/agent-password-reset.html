<div class="dialog-container">

  <!-- Close -->
  <button type="button" class="dialog-close" id="closeDialog" aria-label="Close">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"
         stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <line x1="1" y1="1" x2="13" y2="13"/>
      <line x1="13" y1="1" x2="1"  y2="13"/>
    </svg>
  </button>

  <!-- Header -->
  <div class="dialog-header">
    <h1 data-lan-eng="Reset Password">Reset Password</h1>
  </div>

  <p class="dialog-subtitle">
    Enter your ID, name, and registered email to receive a temporary password.
  </p>

  <div class="dialog-divider"></div>

  <!-- Body -->
  <div class="dialog-content">

    <!-- Error (shown dynamically) -->
    <div id="resetPasswordError" class="error-message" style="display:none;"></div>

    <!-- ID -->
    <div class="field">
      <div class="input-box">
        <div class="field-icon">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"
               stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <rect x="2" y="2" width="12" height="12" rx="2"/>
            <path d="M5 8h6M5 5.5h3M5 10.5h4"/>
          </svg>
        </div>
        <input type="text" id="resetEmail" placeholder="x"
               autocomplete="username" required />
        <span class="label-name" data-lan-eng="ID">
          ID <span class="req">*</span>
        </span>
      </div>
    </div>

    <!-- Name -->
    <div class="field">
      <div class="input-box">
        <div class="field-icon">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"
               stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <circle cx="8" cy="5.5" r="2.5"/>
            <path d="M2 13.5c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
          </svg>
        </div>
        <input type="text" id="resetManagerName" placeholder="x"
               autocomplete="name" required />
        <span class="label-name" data-lan-eng="Name">
          Name <span class="req">*</span>
        </span>
      </div>
    </div>

    <!-- Email -->
    <div class="field">
      <div class="input-box">
        <div class="field-icon">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"
               stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <rect x="1.5" y="3.5" width="13" height="9" rx="1.5"/>
            <path d="M1.5 5.5l6.5 4 6.5-4"/>
          </svg>
        </div>
        <input type="email" id="resetManagerEmail" placeholder="x"
               autocomplete="email" required />
        <span class="label-name" data-lan-eng="Email">
          Email <span class="req">*</span>
        </span>
      </div>
    </div>

  </div><!-- /.dialog-content -->

  <!-- Footer -->
  <div class="dialog-controls">
    <button type="button" class="jw-button typeB" id="resetPasswordBtn"
            data-lan-eng="Get Temporary Password" onclick="resetUnifiedPassword()">
      Get Temporary Password
    </button>

    <div class="dialog-footer-links">
      <a href="#">Find ID</a>
      <span class="sep">·</span>
      <a href="#">Sign in</a>
      <span class="sep">·</span>
      <a href="#">Help</a>
    </div>
  </div>

</div><!-- /.dialog-container -->


<script>
  /* ─────────────────────────────────────────────────────
     Reset Password — agent → guide fallback
  ───────────────────────────────────────────────────── */
  async function resetUnifiedPassword() {
    const id    = document.getElementById('resetEmail').value.trim();
    const name  = document.getElementById('resetManagerName').value.trim();
    const email = document.getElementById('resetManagerEmail').value.trim();

    /* Validation */
    if (!id || !name || !email) {
      showResetError('Please fill in all required fields.');
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showResetError('Please enter a valid email address.');
      return;
    }

    hideResetError();
    setResetLoading(true);

    try {
      const base = window.location.pathname.includes('/member/')
        ? '../backend/api/'
        : './backend/api/';

      const tryPost = async (url, fd) => {
        const res  = await fetch(url, { method: 'POST', body: fd, credentials: 'same-origin' });
        const json = await res.json().catch(() => ({}));
        return { ok: res.ok, json };
      };

      /* 1. Agent endpoint */
      const fd1 = new FormData();
      fd1.append('resetEmail',       id);
      fd1.append('managerName',      name);
      fd1.append('managerEmail',     email);
      const r1 = await tryPost(base + 'reset-agent-password.php', fd1);
      if (r1.ok && r1.json?.success) { showResetSuccess(); return; }

      /* 2. Guide endpoint */
      const fd2 = new FormData();
      fd2.append('guideId',    id);
      fd2.append('guideName',  name);
      fd2.append('guideEmail', email);
      const r2 = await tryPost(base + 'reset-guide-password.php', fd2);
      if (r2.ok && r2.json?.success) { showResetSuccess(); return; }

      showResetError(r2.json?.message || r1.json?.message || 'Member information cannot be found.');

    } catch (err) {
      console.error('[resetUnifiedPassword]', err);
      showResetError('An error occurred. Please try again.');
    } finally {
      setResetLoading(false);
    }
  }

  /* ── Success state ─────────────────────────────────── */
  function showResetSuccess() {
    /* Swap body content to a confirmation message */
    const content  = document.querySelector('.dialog-content');
    const controls = document.querySelector('.dialog-controls');
    const subtitle = document.querySelector('.dialog-subtitle');

    if (subtitle) subtitle.textContent = 'Check your inbox for the temporary password.';
    if (content)  content.innerHTML = `
      <div class="reset-success">
        <div class="reset-success-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        </div>
        <p class="reset-success-msg">
          A temporary password has been sent to your registered email address.
        </p>
      </div>`;
    if (controls) controls.innerHTML = `
      <button type="button" class="jw-button typeB" onclick="modal_close()">
        Close
      </button>`;
  }

  /* ── UI helpers ────────────────────────────────────── */
  function showResetError(msg) {
    const el = document.getElementById('resetPasswordError');
    el.textContent   = msg;
    el.style.display = 'flex';
  }

  function hideResetError() {
    const el = document.getElementById('resetPasswordError');
    el.style.display = 'none';
    el.textContent   = '';
  }

  function setResetLoading(on) {
    const btn = document.getElementById('resetPasswordBtn');
    if (!btn) return;
    btn.disabled = on;
    btn.classList.toggle('is-loading', on);
    const textNode = Array.from(btn.childNodes)
      .find(n => n.nodeType === Node.TEXT_NODE);
    if (textNode) textNode.textContent = on ? ' Sending…' : ' Get Temporary Password';
  }
</script>

    display: flex;
    flex-direction: column;

</style>
