<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>SMART TRAVEL ADMIN</title>

	<!-- 공통 스타일 -->
	<link rel="shortcut icon" href="../image/favicon.ico">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../css/a_reset.css">

	<!-- 날짜 범위 선택용 라이브러리 -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css">
	<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
	<style>
		/* 정렬 가능 컬럼 스타일 */
		th.sortable {
			user-select: none;
		}
		th.sortable:hover {
			background-color: #f5f5f5;
		}
		th.sortable .th-content {
			display: inline-flex;
			align-items: center;
			gap: 4px;
		}
		th.sortable .sort-icon {
			display: inline-block;
			width: 16px;
			height: 16px;
			vertical-align: middle;
		}
		th.sortable .sort-icon::after {
			content: '⇅';
			font-size: 12px;
			color: #999;
		}
		th.sortable.sort-asc .sort-icon::after {
			content: '▲';
			color: #333;
		}
		th.sortable.sort-desc .sort-icon::after {
			content: '▼';
			color: #333;
		}

		/* 페이지네이션 스타일 */
		.pagination-wrap {
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 4px;
			margin-top: 16px;
			padding: 12px 0;
		}
		.pagination-wrap:empty {
			display: none;
		}
		.pagination-wrap .page-btn {
			min-width: 32px;
			height: 32px;
			padding: 0 8px;
			border: 1px solid #d4d4d4;
			background: #fff;
			border-radius: 6px;
			font-size: 14px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.pagination-wrap .page-btn:hover {
			background: #f5f5f5;
		}
		.pagination-wrap .page-btn.active {
			background: #3b82f6;
			color: #fff;
			border-color: #3b82f6;
		}
		.pagination-wrap .page-btn:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}
		.pagination-wrap .page-info {
			margin: 0 8px;
			font-size: 14px;
			color: #666;
		}

		/* 탭 스타일 */
		.tab-wrap {
			display: flex;
			gap: 8px;
			margin-bottom: 16px;
			border-bottom: 2px solid #e5e5e5;
			padding-bottom: 0;
			flex-wrap: wrap;
		}
		.tab-btn {
			padding: 12px 20px;
			border: none;
			background: transparent;
			font-size: 14px;
			font-weight: 500;
			color: #6b7280;
			cursor: pointer;
			border-bottom: 3px solid transparent;
			margin-bottom: -2px;
			transition: all 0.2s;
			display: flex;
			align-items: center;
			gap: 8px;
		}
		.tab-btn:hover {
			color: #3b82f6;
		}
		.tab-btn.active {
			color: #3b82f6;
			border-bottom-color: #3b82f6;
		}
		.tab-btn .badge {
			padding: 2px 8px;
			border-radius: 10px;
			font-size: 12px;
			font-weight: 600;
			color: #fff;
			content: none !important;
		}
		.tab-btn .badge::before {
			content: none !important;
		}
		.tab-content {
			display: none;
		}
		.tab-content.active {
			display: block;
		}
	</style>
</head>

					<form class="search-form" action="" method="get" id="filterForm" onsubmit="applyFilters(); return false;">

								<img src="../image/calendar.svg" alt="">
							</button>
						</div>
						<select class="select" name="status" id="statusFilter" onchange="applyFilters()">

							<optgroup label="Pending">
								<option value="pending" data-lan-eng="Pending">Pending</option>
								<option value="pending_update" data-lan-eng="Pending Update">Pending Update</option>
							</optgroup>
							<optgroup label="Waiting Payment">
								<option value="waiting_down_payment" data-lan-eng="Waiting for Down Payment">Waiting for Down Payment</option>
								<option value="waiting_second_payment" data-lan-eng="Waiting for Second Payment">Waiting for Second Payment</option>
								<option value="waiting_balance" data-lan-eng="Waiting for Balance">Waiting for Balance</option>
								<option value="waiting_full_payment" data-lan-eng="Waiting for Full Payment">Waiting for Full Payment</option>
							</optgroup>
							<optgroup label="Checking Payment">
								<option value="checking_down_payment" data-lan-eng="Checking Down Payment">Checking Down Payment</option>

								<option value="checking_full_payment" data-lan-eng="Checking Full Payment">Checking Full Payment</option>
							</optgroup>
							<optgroup label="Rejected">
								<option value="rejected" data-lan-eng="Payment Rejected">Payment Rejected</option>
								<option value="check_reject" data-lan-eng="Check Reject">Check Reject</option>
							</optgroup>
							<optgroup label="Completed">
								<option value="confirmed" data-lan-eng="Reservation Confirmed">Reservation Confirmed</option>
								<option value="completed" data-lan-eng="Trip Completed">Trip Completed</option>
							</optgroup>
							<optgroup label="Cancelled">
								<option value="cancelled" data-lan-eng="Reservation Cancelled">Reservation Cancelled</option>
								<option value="waiting_cancelled" data-lan-eng="Waiting for Cancellation">Waiting for Cancellation</option>
								<option value="refunded" data-lan-eng="Refund Completed">Refund Completed</option>
							</optgroup>
						</select>
						<div class="search-field">
							<select class="select" name="searchType" id="searchType" onchange="applyFilters()">
								<option value="" data-lan-eng="All">All</option>
								<option value="product" data-lan-eng="Product Name">Product Name</option>
								<option value="customer" data-lan-eng="Reservation Name">Reservation Name</option>
							</select>
							<input type="text" class="search-input" id="searchInput" placeholder=" search" data-lan-eng="Search" onkeyup="if(event.key==='Enter') applyFilters()">
							<button type="submit" class="jw-button search-btn" aria-label="검색" onclick="applyFilters(); return false;">
								<span class="search-ico"><img src="../image/search.svg" alt=""></span>
							</button>
						</div>
					</form>
				</div>
			</div>
