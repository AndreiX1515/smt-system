<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>SMART TRAVEL ADMIN</title>

	<link rel="shortcut icon" href="../image/favicon.ico">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../css/a_reset.css">
	<link rel="stylesheet" href="../css/a_variables.css">
	<link rel="stylesheet" href="../css/a_components.css?v=20260212">
	<link rel="stylesheet" href="../css/a_contents.css?v=20260212">

	<style>
		/* 상태 뱃지 */
		.status-badge {
			display: inline-block; padding: 4px 12px; border-radius: 12px;
			font-size: 13px; font-weight: 600; white-space: nowrap;
		}
		.status-badge.not_set { background: #f3f4f6; color: #6b7280; }
		.status-badge.pending_payment { background: #fff7ed; color: #ea580c; }
		.status-badge.checking { background: #eff6ff; color: #2563eb; }
		.status-badge.confirmed { background: #f0fdf4; color: #16a34a; }
		.status-badge.rejected { background: #fef2f2; color: #dc2626; }

		/* Traveler 카드 */
		.traveler-card {
			border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 12px;
		}
		.traveler-card-header {
			display: flex; justify-content: space-between; align-items: center;
			margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #f3f4f6;
		}
		.traveler-card-header h4 { margin: 0; font-size: 14px; font-weight: 600; }
		.traveler-type-badge {
			display: inline-block; padding: 2px 8px; border-radius: 4px;
			font-size: 11px; font-weight: 600; text-transform: uppercase;
		}
		.traveler-type-badge.adult { background: #dbeafe; color: #1d4ed8; }
		.traveler-type-badge.child { background: #fef3c7; color: #b45309; }
		.traveler-type-badge.infant { background: #fce7f3; color: #be185d; }

		/* 옵션 카테고리 */
		.option-category { margin-bottom: 12px; }
		.option-category-title {
			font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px;
		}
		.option-item {
			display: flex; align-items: center; gap: 8px; padding: 6px 0;
		}
		.option-item label {
			display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px;
		}
		.option-price { color: #6b7280; font-size: 12px; margin-left: auto; }
		.traveler-subtotal {
			text-align: right; font-weight: 600; font-size: 14px; color: #1d4ed8;
			padding-top: 8px; border-top: 1px solid #e5e7eb; margin-top: 8px;
		}

		/* 합계 */
		.total-summary {
			display: flex; justify-content: space-between; align-items: center;
			padding: 16px 20px; background: #f0f9ff; border-radius: 8px;
			font-size: 16px; font-weight: 700;
		}
		.total-amount { color: #1d4ed8; font-size: 20px; }

		/* 파일 섹션 */
		.file-display {
			display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
		}
		.file-info {
			display: flex; align-items: center; gap: 6px;
		}
		.file-actions {
			display: flex; gap: 6px;
		}

		/* 반려 알림 */
		.rejection-alert {
			background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px;
			padding: 12px 16px; margin-bottom: 16px;
		}
		.rejection-alert-title { color: #dc2626; font-weight: 600; margin-bottom: 4px; }
		.rejection-alert-reason { color: #991b1b; font-size: 13px; }
		.rejection-alert-date { color: #9ca3af; font-size: 12px; margin-top: 4px; }

		/* Summary grid */
		.summary-grid {
			display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px;
		}
		.summary-item label { font-size: 12px; color: #6b7280; display: block; margin-bottom: 2px; }
		.summary-item .value { font-size: 14px; font-weight: 500; color: #111827; }
	</style>
</head>

<body>

	<header class="layout-header"></header>

	<main class="layout-main">
		<nav class="layout-nav"></nav>

		<section class="layout-content">
			<div class="page-toolbar">
				<a href="extra-options.html" class="jw-button jw-button-back" aria-label="Return to list">
					<img src="../image/arrow4.svg" alt="">
					<span data-lan-eng="Return to list">Return to list</span>
				</a>
			</div>

			<h1 class="page-title" data-lan-eng="Extra Options Detail">Extra Options Detail</h1>

			<!-- Booking Summary -->
			<div class="card-panel jw-mgt16" id="bookingSummarySection">
				<h3 class="card-panel-title" data-lan-eng="Booking Summary">Booking Summary</h3>
				<div class="card-panel-divider"></div>
				<div class="summary-grid jw-mgt16" id="bookingSummary">
					<div class="summary-item"><label>Booking ID</label><div class="value" id="summaryBookingId">-</div></div>
					<div class="summary-item"><label>Product Name</label><div class="value" id="summaryProductName">-</div></div>
					<div class="summary-item"><label>Travel Period</label><div class="value" id="summaryTravelPeriod">-</div></div>
					<div class="summary-item"><label>PAX</label><div class="value" id="summaryPax">-</div></div>
				</div>
			</div>

			<!-- Flight Options Selection -->
			<div class="card-panel jw-mgt16" id="flightOptionsSection">
				<h3 class="card-panel-title" data-lan-eng="Flight Options Selection">Flight Options Selection</h3>
				<div class="card-panel-divider"></div>
				<div id="travelerOptionsContainer" class="jw-mgt16">
					<p class="is-center">Loading...</p>
				</div>
			</div>

			<!-- Option Fee Summary -->
			<div class="card-panel jw-mgt16">
				<div class="total-summary">
					<span data-lan-eng="Total Option Fee">Total Option Fee</span>
					<span class="total-amount" id="totalOptionFee">₱0</span>
				</div>
				<div style="text-align: right; margin-top: 12px;">
					<button type="button" class="jw-button typeB" id="saveOptionsBtn" onclick="saveOptions()">
						Save Options
					</button>
				</div>
			</div>

			<!-- Payment Proof -->
			<div class="card-panel jw-mgt16" id="paymentProofSection" style="display:none;">
				<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
					<h3 class="card-panel-title" data-lan-eng="Payment Proof">Payment Proof</h3>
					<span class="status-badge" id="paymentStatusBadge">-</span>
				</div>
				<div class="card-panel-divider"></div>

				<!-- Rejection Alert -->
				<div id="rejectionAlert" class="rejection-alert jw-mgt16" style="display:none;">
					<div class="rejection-alert-title">Payment Rejected</div>
					<div class="rejection-alert-reason" id="rejectionReason"></div>
					<div class="rejection-alert-date" id="rejectionDate"></div>
				</div>

				<!-- File Display -->
				<div class="jw-mgt16">
					<div id="fileDisplay" class="file-display" style="display:none;">
						<div class="file-info">
							<img src="../image/file.svg" alt="" style="width:16px;">
							<span id="fileName"></span>
						</div>
						<div class="file-actions">
							<button type="button" class="jw-button typeF" id="viewFileBtn" title="View" onclick="viewFile()">
								<img src="../image/eye.svg" alt="">
							</button>
							<button type="button" class="jw-button typeF" id="downloadFileBtn" title="Download" onclick="downloadFile()">
								<img src="../image/buttun-download.svg" alt="">
							</button>
							<button type="button" class="jw-button typeF" id="deleteFileBtn" title="Delete" onclick="deleteFile()">
								<img src="../image/button-close2.svg" alt="">
							</button>
						</div>
					</div>

					<div id="fileUpload">
						<input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.gif" style="display:none;" onchange="uploadFile()">
						<button type="button" class="jw-button typeA" id="uploadBtn" onclick="document.getElementById('fileInput').click()">
							Upload Payment Proof
						</button>
					</div>
				</div>
			</div>

		</section>
	</main>

	<script src="../js/default.js"></script>
	<script src="../js/agent.js"></script>
	<script src="../js/agent-extra-options-detail.js?v=20260212b"></script>
	<script>
		init({
			headerUrl: '../inc/header.html',
			navUrl: '../inc/nav_agent.html'
		});
	</script>
</body>

</html>
