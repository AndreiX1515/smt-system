<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>SMART TRAVEL ADMIN</title>

	<!-- 공통 스타일 -->
	<link rel="shortcut icon" href="../image/favicon.ico">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../css/a_reset.css">
	<link rel="stylesheet" href="../css/a_variables.css">
	<link rel="stylesheet" href="../css/a_components.css?v=20260212">
	<link rel="stylesheet" href="../css/a_contents.css?v=20260212">

	<style>
		/* 탭 스타일 */
		.tab-wrap {
			display: flex;
			gap: 8px;
			margin-bottom: 16px;
			border-bottom: 2px solid #e5e5e5;
			padding-bottom: 0;
			flex-wrap: wrap;
		}
		.tab-btn {
			padding: 12px 20px;
			border: none;
			background: transparent;
			font-size: 14px;
			font-weight: 500;
			color: #6b7280;
			cursor: pointer;
			border-bottom: 3px solid transparent;
			margin-bottom: -2px;
			transition: all 0.2s;
			display: flex;
			align-items: center;
			gap: 8px;
		}
		.tab-btn:hover { color: #3b82f6; }
		.tab-btn.active {
			color: #3b82f6;
			border-bottom-color: #3b82f6;
		}
		.tab-btn .tab-badge {
			padding: 2px 8px;
			border-radius: 10px;
			font-size: 12px;
			font-weight: 600;
			color: #fff;
			height: auto;
			line-height: normal;
		}
		.tab-btn .tab-badge::before {
			content: none !important;
			display: none !important;
		}
		.tab-content { display: none; }
		.tab-content.active { display: block; }

		/* 페이지네이션 */
		.pagination-wrap {
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 4px;
			margin-top: 16px;
			padding: 12px 0;
		}
		.pagination-wrap:empty { display: none; }
		.pagination-wrap .page-btn {
			min-width: 32px; height: 32px; padding: 0 8px;
			border: 1px solid #d4d4d4; background: #fff; border-radius: 6px;
			font-size: 14px; cursor: pointer;
			display: flex; align-items: center; justify-content: center;
		}
		.pagination-wrap .page-btn:hover { background: #f5f5f5; }
		.pagination-wrap .page-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
		.pagination-wrap .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

		/* 상태 뱃지 */
		.status-badge {
			display: inline-block; padding: 4px 10px; border-radius: 12px;
			font-size: 12px; font-weight: 600; white-space: nowrap;
		}
		.status-badge.not_set { background: #f3f4f6; color: #6b7280; }
		.status-badge.pending_payment { background: #fff7ed; color: #ea580c; }
		.status-badge.checking { background: #eff6ff; color: #2563eb; }
		.status-badge.confirmed { background: #f0fdf4; color: #16a34a; }
		.status-badge.rejected { background: #fef2f2; color: #dc2626; }

		.jw-tableA tbody tr { cursor: pointer; }
		.jw-tableA tbody tr:hover { background: #f9fafb; }
	</style>
</head>

<body>

	<header class="layout-header"></header>

	<main class="layout-main">
		<nav class="layout-nav"></nav>

		<section class="layout-content">
			<h1 class="page-title" data-lan-eng="Extra Options">Extra Options</h1>

			<!-- 검색 영역 -->
			<div class="card-panel jw-mgt32">
				<div class="list-header">
					<div class="result-count">
						<span data-lan-eng="Total">Total</span> <span class="result-count__num" id="totalCount">0</span><span data-lan-eng="items">items</span>
					</div>
					<form class="search-form" id="filterForm" onsubmit="applyFilters(); return false;">
						<div class="search-field">
							<select class="select" id="searchType">
								<option value="" data-lan-eng="All">All</option>
								<option value="bookingId" data-lan-eng="Booking ID">Booking ID</option>
								<option value="product" data-lan-eng="Product Name">Product Name</option>
							</select>
							<input type="text" class="search-input" id="searchInput" placeholder="Search" data-lan-eng="Search" onkeyup="if(event.key==='Enter') applyFilters()">
							<button type="submit" class="jw-button search-btn" aria-label="Search" onclick="applyFilters(); return false;">
								<span class="search-ico"><img src="../image/search.svg" alt=""></span>
							</button>
						</div>
					</form>
				</div>
			</div>

			<!-- 탭 영역 -->
			<div class="card-panel jw-mgt24">
				<div class="tab-wrap">
					<button type="button" class="tab-btn active" data-tab="all" onclick="switchTab('all')">
						<span>All</span>
						<span class="tab-badge" id="allCount" style="background:#6b7280;">0</span>
					</button>
					<button type="button" class="tab-btn" data-tab="not_set" onclick="switchTab('not_set')">
						<span>Not Set</span>
						<span class="tab-badge" id="notSetCount" style="background:#9ca3af;">0</span>
					</button>
					<button type="button" class="tab-btn" data-tab="pending_payment" onclick="switchTab('pending_payment')">
						<span>Pending Payment</span>
						<span class="tab-badge" id="pendingPaymentCount" style="background:#ea580c;">0</span>
					</button>
					<button type="button" class="tab-btn" data-tab="checking" onclick="switchTab('checking')">
						<span>Checking</span>
						<span class="tab-badge" id="checkingCount" style="background:#2563eb;">0</span>
					</button>
					<button type="button" class="tab-btn" data-tab="confirmed" onclick="switchTab('confirmed')">
						<span>Confirmed</span>
						<span class="tab-badge" id="confirmedCount" style="background:#16a34a;">0</span>
					</button>
					<button type="button" class="tab-btn" data-tab="rejected" onclick="switchTab('rejected')">
						<span>Rejected</span>
						<span class="tab-badge" id="rejectedCount" style="background:#dc2626;">0</span>
					</button>
				</div>

				<table class="jw-tableA">
					<colgroup>
						<col style="width:50px;"><col style="width:130px;"><col><col style="width:80px;"><col style="width:120px;"><col style="width:130px;"><col style="width:120px;">
					</colgroup>
					<thead>
						<tr>
							<th class="no is-center">No</th>
							<th class="is-center" data-lan-eng="Booking ID">Booking ID</th>
							<th data-lan-eng="Product Name">Product Name</th>
							<th class="is-center" data-lan-eng="PAX">PAX</th>
							<th class="is-center" data-lan-eng="Travel Date">Travel Date</th>
							<th class="is-center" data-lan-eng="Option Status">Option Status</th>
							<th class="is-center" data-lan-eng="Option Fee">Option Fee</th>
						</tr>
					</thead>
					<tbody id="tableBody">
						<tr><td colspan="7" class="is-center">Loading...</td></tr>
					</tbody>
				</table>
				<div class="pagination-wrap" id="pagination"></div>
			</div>
		</section>
	</main>

	<script src="../js/default.js"></script>
	<script src="../js/agent.js"></script>
	<script src="../js/agent-extra-options.js?v=20260212b"></script>
	<script>
		init({
			headerUrl: '../inc/header.html',
			navUrl: '../inc/nav_agent.html'
		});
	</script>
</body>

</html>
