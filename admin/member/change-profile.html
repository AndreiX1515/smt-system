<style>
	.dialog-container .dialog-content::-webkit-scrollbar {
		display: none;
	}
	.cp-field { margin-bottom: 20px; }
	.cp-field label {
		display: block;
		font-size: 13px;
		font-weight: 500;
		margin-bottom: 6px;
		color: #333;
	}
	.cp-field label .req { color: #ef4444; margin-left: 2px; }
	.cp-field input {
		width: 100%;
		padding: 10px 12px;
		border: 1px solid #d1d5db;
		border-radius: 4px;
		font-size: 14px;
		box-sizing: border-box;
	}
	.cp-field input:focus {
		outline: none;
		border-color: #3b82f6;
		box-shadow: 0 0 0 2px rgba(59,130,246,0.15);
	}
</style>

<div class="dialog-container" style="display:flex; flex-direction:column; height:100%;">
	<button type="button" class="dialog-close" id="closeDialog" onclick="modal_close()"><i class="ic-close"></i></button>

	<h1 data-lan-eng="Change Profile" style="flex-shrink:0;">Change Profile</h1>

	<div class="dialog-content jw-mgt30" style="flex:1; overflow-y:auto; padding-right:8px; min-height:0; scrollbar-width:none; -ms-overflow-style:none;">
		<div id="cpLoading" style="text-align:center; padding:40px 0; color:#6b7280; font-size:14px;">Loading...</div>

		<form id="changeProfileForm" style="display:none;">
			<div class="cp-field">
				<label data-lan-eng="Agency Name">Agency Name <span class="req">*</span></label>
				<input type="text" id="cpAgencyName" required placeholder="Enter agency name">
			</div>
			<div class="cp-field">
				<label data-lan-eng="First Name">First Name <span class="req">*</span></label>
				<input type="text" id="cpFName" required placeholder="Enter first name">
			</div>
			<div class="cp-field">
				<label data-lan-eng="Middle Name">Middle Name</label>
				<input type="text" id="cpMName" placeholder="Enter middle name (optional)">
			</div>
			<div class="cp-field">
				<label data-lan-eng="Last Name">Last Name <span class="req">*</span></label>
				<input type="text" id="cpLName" required placeholder="Enter last name">
			</div>
			<div class="cp-field">
				<label data-lan-eng="Business Email">Business Email <span class="req">*</span></label>
				<input type="email" id="cpEmail" required placeholder="Enter business email">
			</div>
			<div class="cp-field">
				<label data-lan-eng="Contact Number">Contact Number <span class="req">*</span></label>
				<input type="text" id="cpContactNo" required placeholder="Enter phone number (e.g., +631234567890)">
			</div>
		</form>

		<div id="cpError" style="display:none; color:#ef4444; font-size:14px; margin-top:12px; line-height:1.4;"></div>
	</div>

	<div class="dialog-controls" style="flex-shrink:0; margin-top:24px; padding-top:16px; border-top:1px solid #e5e5e5;">
		<button type="button" class="jw-button typeB" id="cpSubmitBtn" data-lan-eng="Save Changes">Save Changes</button>
	</div>
</div>

<script>
(function () {
	const form = document.getElementById('changeProfileForm');
	const loading = document.getElementById('cpLoading');
	const errorDiv = document.getElementById('cpError');
	const btn = document.getElementById('cpSubmitBtn');

	function showErr(msg) {
		errorDiv.textContent = msg || '';
		errorDiv.style.display = msg ? 'block' : 'none';
	}

	// 프로필 데이터 로드
	fetch('/admin/backend/api/get-agent-profile.php', { credentials: 'same-origin', cache: 'no-store' })
		.then(r => {
			if (r.status === 401) { alert('Login required'); window.location.href = '/admin/index.html'; return null; }
			return r.json();
		})
		.then(data => {
			if (!data) return;
			loading.style.display = 'none';

			if (!data.success) {
				showErr(data.message || 'Failed to load profile');
				return;
			}

			const d = data.data;
			document.getElementById('cpAgencyName').value = d.agencyName || '';
			document.getElementById('cpFName').value = d.fName || '';
			document.getElementById('cpMName').value = d.mName || '';
			document.getElementById('cpLName').value = d.lName || '';
			document.getElementById('cpEmail').value = d.personInChargeEmail || '';
			document.getElementById('cpContactNo').value = d.contactNo || '';

			form.style.display = 'block';
		})
		.catch(() => {
			loading.style.display = 'none';
			showErr('Failed to load profile data');
		});

	// 저장
	btn.addEventListener('click', async () => {
		showErr('');
		const agencyName = document.getElementById('cpAgencyName').value.trim();
		const fName = document.getElementById('cpFName').value.trim();
		const mName = document.getElementById('cpMName').value.trim();
		const lName = document.getElementById('cpLName').value.trim();
		const personInChargeEmail = document.getElementById('cpEmail').value.trim();
		const contactNo = document.getElementById('cpContactNo').value.trim();

		if (!agencyName || !fName || !lName || !personInChargeEmail || !contactNo) {
			showErr('Please fill in all required fields');
			return;
		}

		const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
		if (!emailRegex.test(personInChargeEmail)) {
			showErr('Please enter a valid email address');
			return;
		}

		const prevText = btn.textContent;
		btn.disabled = true;
		btn.textContent = 'Saving...';

		try {
			const res = await fetch('/admin/backend/api/complete-profile.php', {
				method: 'POST',
				credentials: 'same-origin',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({
					agencyName, fName, mName: mName || null, lName, personInChargeEmail, contactNo
				})
			});

			if (res.status === 401) {
				alert('Login required');
				window.location.href = '/admin/index.html';
				return;
			}

			const data = await res.json();

			if (!data.success) {
				showErr(data.message || 'Failed to save profile');
				btn.disabled = false;
				btn.textContent = prevText;
				return;
			}

			// 헤더의 displayName 즉시 업데이트
			const newDisplayName = (fName + ' ' + lName).trim();
			const headerName = document.querySelector('.layout-header .user-name');
			if (headerName) headerName.textContent = newDisplayName;
			const memberName = document.querySelector('.header_memberinfo .name');
			if (memberName) memberName.textContent = newDisplayName;

			alert('Profile updated successfully');
			modal_close();
		} catch (e) {
			showErr('An error occurred. Please try again.');
			btn.disabled = false;
			btn.textContent = prevText;
		}
	});
})();
</script>
