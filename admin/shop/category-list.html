<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>카테고리 관리 - Shop Admin</title>
    <link rel="shortcut icon" href="../image/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/a_reset.css">
    <link rel="stylesheet" href="../css/a_variables.css">
    <link rel="stylesheet" href="../css/a_components.css">
    <link rel="stylesheet" href="../css/a_contents.css">
    <style>
        .shop-admin { padding: 30px; max-width: 800px; margin: 0 auto; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .page-title { font-size: 24px; font-weight: 700; }
        .btn-add { height: 44px; padding: 0 24px; background: #0065F8; color: #fff; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .category-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .category-icon { font-size: 32px; }
        .category-info { flex: 1; }
        .category-name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
        .category-count { font-size: 14px; color: #0065F8; font-weight: 500; }
        .category-actions { display: flex; gap: 8px; }
        .btn-edit { padding: 8px 16px; background: #fff; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; }
        .btn-delete { padding: 8px 16px; background: #fff; border: 1px solid #ef4444; color: #ef4444; border-radius: 8px; cursor: pointer; }

        /* 모달 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
        }
        .modal-title { font-size: 20px; font-weight: 600; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
        .form-input { width: 100%; height: 44px; padding: 0 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
        .modal-btns { display: flex; gap: 12px; margin-top: 24px; }
        .modal-btns button { flex: 1; height: 44px; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; }
        .btn-cancel { background: #f5f5f5; border: none; }
        .btn-save { background: #0065F8; color: #fff; border: none; }
    </style>
</head>
<body>
    <header class="layout-header"></header>

    <main class="layout-main">
        <nav class="layout-nav"></nav>

        <section class="layout-content">
            <div class="shop-admin">
                <div class="page-header">
                    <h1 class="page-title">카테고리 관리</h1>
                    <button class="btn-add" onclick="openModal()">+ 카테고리 추가</button>
                </div>

                <div id="categoryList">
                    <!-- 카테고리 목록 -->
                </div>
            </div>
        </section>
    </main>

    <!-- 모달 -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">카테고리 추가</div>
            <form id="categoryForm">
                <input type="hidden" id="categoryId">
                <div class="form-group">
                    <label class="form-label">카테고리명</label>
                    <input type="text" class="form-input" id="catName" required>
                </div>
                <div class="form-group">
                    <label class="form-label">정렬 순서</label>
                    <input type="number" class="form-input" id="catOrder" value="0">
                </div>
                <div class="modal-btns">
                    <button type="button" class="btn-cancel" onclick="closeModal()">취소</button>
                    <button type="submit" class="btn-save">저장</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/default.js"></script>
    <script src="../js/super.js"></script>
    <script>
        init({
            headerUrl: '../inc/header.html',
            navUrl: '../inc/nav_super.html'
        });

        const API_BASE = '/backend/api/shop';

        async function loadCategories() {
            try {
                const res = await fetch(`${API_BASE}/categories.php`);
                const data = await res.json();

                const container = document.getElementById('categoryList');
                if (data.success && data.categories.length > 0) {
                    container.innerHTML = data.categories.map(cat => `
                        <div class="category-card">
                            <div class="category-icon">📁</div>
                            <div class="category-info">
                                <div class="category-name">${cat.name}</div>
                            </div>
                            <div class="category-count">${cat.product_count}개 상품</div>
                            <div class="category-actions">
                                <button class="btn-edit" onclick='editCategory(${JSON.stringify(cat)})'>수정</button>
                                <button class="btn-delete" onclick="deleteCategory(${cat.id}, '${cat.name}')">삭제</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p style="text-align:center;color:#888;padding:40px;">카테고리가 없습니다.</p>';
                }
            } catch (e) {
                console.error(e);
            }
        }

        function openModal(cat = null) {
            document.getElementById('modal').classList.add('show');
            if (cat) {
                document.getElementById('modalTitle').textContent = '카테고리 수정';
                document.getElementById('categoryId').value = cat.id;
                document.getElementById('catName').value = cat.name;
                document.getElementById('catOrder').value = cat.sort_order;
            } else {
                document.getElementById('modalTitle').textContent = '카테고리 추가';
                document.getElementById('categoryForm').reset();
                document.getElementById('categoryId').value = '';
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
        }

        function editCategory(cat) {
            openModal(cat);
        }

        async function deleteCategory(id, name) {
            if (!confirm(`"${name}" 카테고리를 삭제하시겠습니까?\n이 카테고리의 상품도 함께 카테고리가 해제됩니다.`)) return;

            try {
                const res = await fetch(`${API_BASE}/categories.php?id=${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    alert('삭제되었습니다.');
                    loadCategories();
                } else {
                    alert(data.error || '삭제 실패');
                }
            } catch (e) {
                alert('오류가 발생했습니다.');
            }
        }

        document.getElementById('categoryForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const id = document.getElementById('categoryId').value;
            const formData = {
                name: document.getElementById('catName').value,
                sort_order: parseInt(document.getElementById('catOrder').value) || 0
            };

            if (id) formData.id = id;

            try {
                const res = await fetch(`${API_BASE}/categories.php`, {
                    method: id ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const data = await res.json();

                if (data.success) {
                    closeModal();
                    loadCategories();
                } else {
                    alert(data.error || '저장 실패');
                }
            } catch (e) {
                alert('오류가 발생했습니다.');
            }
        });

        loadCategories();
    </script>
</body>
</html>
