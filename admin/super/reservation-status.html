<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>Reservation Status - SMART TRAVEL ADMIN</title>

	<link rel="shortcut icon" href="../image/favicon.ico">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../css/a_reset.css">
	<link rel="stylesheet" href="../css/a_variables.css">
	<link rel="stylesheet" href="../css/a_components.css">
	<link rel="stylesheet" href="../css/a_contents.css">
	<style>
		.status-cards {
			display: flex;
			gap: 32px;
			margin-top: 40px;
		}
		.status-card {
			flex: 1;
			max-width: 400px;
			background: #fff;
			border-radius: 20px;
			padding: 48px 40px;
			box-shadow: 0 4px 20px rgba(0,0,0,0.1);
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 24px;
			cursor: pointer;
			transition: all 0.3s ease;
			border: 2px solid transparent;
		}
		.status-card:hover {
			transform: translateY(-8px);
			box-shadow: 0 12px 40px rgba(0,0,0,0.15);
		}
		.status-card.pending:hover {
			border-color: #f59e0b;
		}
		.status-card.pending-update:hover {
			border-color: #0ea5e9;
		}
		.status-card .icon {
			width: 100px;
			height: 100px;
			border-radius: 24px;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.status-card .icon svg {
			width: 50px;
			height: 50px;
			stroke: #fff;
		}
		.status-card.pending .icon {
			background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
		}
		.status-card.pending-update .icon {
			background: linear-gradient(135deg, #0ea5e9 0%, #38bdf8 100%);
		}
		.status-card .info {
			text-align: center;
		}
		.status-card .info h3 {
			font-size: 64px;
			font-weight: 700;
			margin: 0;
			color: #1f2937;
			line-height: 1;
		}
		.status-card .info p {
			font-size: 20px;
			color: #6b7280;
			margin: 12px 0 0 0;
			font-weight: 500;
		}
		.status-card .arrow {
			margin-top: 8px;
			color: #9ca3af;
			transition: all 0.3s ease;
		}
		.status-card:hover .arrow {
			color: #374151;
			transform: translateX(4px);
		}
		.refresh-controls {
			display: flex;
			align-items: center;
			gap: 16px;
			margin-bottom: 24px;
		}
		.last-updated {
			font-size: 13px;
			color: #6b7280;
		}
		.refresh-btn {
			display: flex;
			align-items: center;
			gap: 6px;
			padding: 8px 16px;
			border: 1px solid #d1d5db;
			border-radius: 8px;
			background: #fff;
			font-size: 13px;
			color: #374151;
			cursor: pointer;
			transition: all 0.2s;
		}
		.refresh-btn:hover {
			background: #f9fafb;
			border-color: #9ca3af;
		}
		.refresh-btn svg {
			width: 16px;
			height: 16px;
		}
		.refresh-btn.spinning svg {
			animation: spin 1s linear infinite;
		}
		@keyframes spin {
			to { transform: rotate(360deg); }
		}
		.auto-toggle {
			display: flex;
			align-items: center;
			gap: 8px;
			font-size: 13px;
			color: #6b7280;
		}
		.toggle-switch {
			position: relative;
			width: 40px;
			height: 22px;
		}
		.toggle-switch input {
			opacity: 0;
			width: 0;
			height: 0;
		}
		.toggle-slider {
			position: absolute;
			cursor: pointer;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background-color: #d1d5db;
			transition: 0.3s;
			border-radius: 22px;
		}
		.toggle-slider:before {
			position: absolute;
			content: "";
			height: 16px;
			width: 16px;
			left: 3px;
			bottom: 3px;
			background-color: white;
			transition: 0.3s;
			border-radius: 50%;
		}
		.toggle-switch input:checked + .toggle-slider {
			background-color: #2563eb;
		}
		.toggle-switch input:checked + .toggle-slider:before {
			transform: translateX(18px);
		}
		@media (max-width: 768px) {
			.status-cards {
				flex-direction: column;
				align-items: center;
			}
			.status-card {
				max-width: 100%;
				width: 100%;
			}
		}
	</style>
</head>

<body>
	<header class="layout-header"></header>

	<main class="layout-main">
		<nav class="layout-nav"></nav>

		<section class="layout-content">
			<h1 class="page-title" data-lan-eng="Reservation Status">Reservation Status</h1>

			<!-- Refresh Controls -->
			<div class="refresh-controls jw-mgt24">
				<span class="last-updated">Last updated: <strong id="lastUpdated">-</strong></span>
				<div class="auto-toggle">
					<label class="toggle-switch">
						<input type="checkbox" id="autoRefreshToggle" checked>
						<span class="toggle-slider"></span>
					</label>
					<span>Auto-refresh (30s)</span>
				</div>
				<button class="refresh-btn" id="refreshBtn" onclick="fetchData()">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path d="M23 4v6h-6M1 20v-6h6"/>
						<path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
					</svg>
					Refresh
				</button>
			</div>

			<!-- Status Cards -->
			<div class="status-cards">
				<div class="status-card pending" onclick="goToPendingList('pending')">
					<div class="icon">
						<svg viewBox="0 0 24 24" fill="none" stroke-width="2">
							<circle cx="12" cy="12" r="10"/>
							<polyline points="12,6 12,12 16,14"/>
						</svg>
					</div>
					<div class="info">
						<h3 id="pendingCount">0</h3>
						<p>Pending</p>
					</div>
					<div class="arrow">
						<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
							<path d="M5 12h14M12 5l7 7-7 7"/>
						</svg>
					</div>
				</div>
				<div class="status-card pending-update" onclick="goToPendingList('pending_update')">
					<div class="icon">
						<svg viewBox="0 0 24 24" fill="none" stroke-width="2">
							<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
							<path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
						</svg>
					</div>
					<div class="info">
						<h3 id="pendingUpdateCount">0</h3>
						<p>Pending Update</p>
					</div>
					<div class="arrow">
						<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
							<path d="M5 12h14M12 5l7 7-7 7"/>
						</svg>
					</div>
				</div>
			</div>

		</section>
	</main>

	<script src="../js/default.js"></script>
	<script src="../js/super.js"></script>
	<script>
		const REFRESH_INTERVAL = 30000;
		let autoRefreshInterval = null;
		let isRefreshing = false;

		init({
			headerUrl: '../inc/header.html',
			navUrl: '../inc/nav_super.html'
		});

		function goToPendingList(status) {
			window.location.href = `b2b-pending-list.html?status=${status}`;
		}

		async function fetchData() {
			if (isRefreshing) return;

			const refreshBtn = document.getElementById('refreshBtn');
			isRefreshing = true;
			refreshBtn.classList.add('spinning');

			try {
				const response = await fetch('../backend/api/reservation-status-api.php', {
					credentials: 'same-origin'
				});
				const result = await response.json();

				if (result.success) {
					document.getElementById('pendingCount').textContent = result.data.pending.count;
					document.getElementById('pendingUpdateCount').textContent = result.data.pendingUpdate.count;
					document.getElementById('lastUpdated').textContent = result.timestamp;
				} else {
					console.error('API Error:', result.error);
				}
			} catch (error) {
				console.error('Fetch Error:', error);
			} finally {
				isRefreshing = false;
				refreshBtn.classList.remove('spinning');
			}
		}

		function toggleAutoRefresh(enabled) {
			if (enabled) {
				autoRefreshInterval = setInterval(fetchData, REFRESH_INTERVAL);
			} else {
				if (autoRefreshInterval) {
					clearInterval(autoRefreshInterval);
					autoRefreshInterval = null;
				}
			}
		}

		document.addEventListener('visibilitychange', function() {
			const autoRefreshToggle = document.getElementById('autoRefreshToggle');
			if (document.hidden) {
				if (autoRefreshInterval) {
					clearInterval(autoRefreshInterval);
					autoRefreshInterval = null;
				}
			} else {
				if (autoRefreshToggle.checked) {
					fetchData();
					toggleAutoRefresh(true);
				}
			}
		});

		document.addEventListener('DOMContentLoaded', async function() {
			try {
				const sessionResponse = await fetch('../backend/api/check-session.php', {
					credentials: 'same-origin'
				});
				const sessionData = await sessionResponse.json();

				if (!sessionData.authenticated) {
					window.location.href = '../index.html';
					return;
				}
			} catch (error) {
				console.error('Session check error:', error);
				window.location.href = '../index.html';
				return;
			}

			fetchData();

			const autoRefreshToggle = document.getElementById('autoRefreshToggle');
			autoRefreshToggle.addEventListener('change', function() {
				toggleAutoRefresh(this.checked);
			});

			toggleAutoRefresh(true);
		});
	</script>
</body>

</html>
