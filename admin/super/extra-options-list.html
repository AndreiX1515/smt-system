<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>SMART TRAVEL ADMIN</title>

	<link rel="shortcut icon" href="../image/favicon.ico">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../css/a_reset.css">
	<link rel="stylesheet" href="../css/a_variables.css">
	<link rel="stylesheet" href="../css/a_components.css?v=20260212">
	<link rel="stylesheet" href="../css/a_contents.css?v=20260212">

	<style>
		.tab-wrap {
			display: flex; gap: 8px; margin-bottom: 16px;
			border-bottom: 2px solid #e5e5e5; padding-bottom: 0; flex-wrap: wrap;
		}
		.tab-btn {
			padding: 12px 20px; border: none; background: transparent;
			font-size: 14px; font-weight: 500; color: #6b7280; cursor: pointer;
			border-bottom: 3px solid transparent; margin-bottom: -2px;
			transition: all 0.2s; display: flex; align-items: center; gap: 8px;
		}
		.tab-btn:hover { color: #3b82f6; }
		.tab-btn.active { color: #3b82f6; border-bottom-color: #3b82f6; }
		.tab-btn .tab-badge {
			padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; color: #fff;
			height: auto; line-height: normal;
		}
		.tab-btn .tab-badge::before { content: none !important; display: none !important; }
		.tab-content { display: none; }
		.tab-content.active { display: block; }

		.pagination-wrap {
			display: flex; justify-content: center; align-items: center; gap: 4px; margin-top: 16px; padding: 12px 0;
		}
		.pagination-wrap:empty { display: none; }
		.pagination-wrap .page-btn {
			min-width: 32px; height: 32px; padding: 0 8px;
			border: 1px solid #d4d4d4; background: #fff; border-radius: 6px;
			font-size: 14px; cursor: pointer;
			display: flex; align-items: center; justify-content: center;
		}
		.pagination-wrap .page-btn:hover { background: #f5f5f5; }
		.pagination-wrap .page-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
		.pagination-wrap .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

		.status-badge {
			display: inline-block; padding: 4px 10px; border-radius: 12px;
			font-size: 12px; font-weight: 600; white-space: nowrap;
		}
		.status-badge.not_set { background: #f3f4f6; color: #6b7280; }
		.status-badge.pending_payment { background: #fff7ed; color: #ea580c; }
		.status-badge.checking { background: #eff6ff; color: #2563eb; }
		.status-badge.confirmed { background: #f0fdf4; color: #16a34a; }
		.status-badge.rejected { background: #fef2f2; color: #dc2626; }

		.action-btns { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
		.action-btns .btn-sm {
			padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 500;
			border: none; cursor: pointer; white-space: nowrap;
		}
		.btn-view { background: #eff6ff; color: #2563eb; }
		.btn-view:hover { background: #dbeafe; }
		.btn-accept { background: #f0fdf4; color: #16a34a; }
		.btn-accept:hover { background: #dcfce7; }
		.btn-reject { background: #fef2f2; color: #dc2626; }
		.btn-reject:hover { background: #fee2e2; }

		/* 반려 사유 모달 */
		.modal-overlay {
			display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
			background: rgba(0,0,0,0.5); z-index: 9999;
			justify-content: center; align-items: center;
		}
		.modal-overlay.show { display: flex; }
		.modal-box {
			background: #fff; border-radius: 12px; padding: 24px; max-width: 480px; width: 90%;
		}
		.modal-box h3 { margin: 0 0 16px; font-size: 16px; }
		.modal-box textarea {
			width: 100%; min-height: 100px; padding: 10px; border: 1px solid #d4d4d4;
			border-radius: 6px; font-size: 14px; resize: vertical; box-sizing: border-box;
		}
		.modal-box .modal-actions {
			display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px;
		}
	</style>
</head>

<body>

	<header class="layout-header"></header>

	<main class="layout-main">
		<nav class="layout-nav"></nav>

		<section class="layout-content">
			<h1 class="page-title" data-lan-eng="Extra Options Management">Extra Options Management</h1>

			<!-- 검색 -->
			<div class="card-panel jw-mgt32">
				<div class="list-header">
					<div class="result-count">
						<span>Total</span> <span class="result-count__num" id="totalCount">0</span><span> items</span>
					</div>
					<form class="search-form" id="filterForm" onsubmit="applyFilters(); return false;">
						<div class="search-field">
							<select class="select" id="searchType">
								<option value="">All</option>
								<option value="bookingId">Booking ID</option>
								<option value="product">Product Name</option>
								<option value="agent">Agent Name</option>
							</select>
							<input type="text" class="search-input" id="searchInput" placeholder="Search" onkeyup="if(event.key==='Enter') applyFilters()">
							<button type="submit" class="jw-button search-btn" onclick="applyFilters(); return false;">
								<span class="search-ico"><img src="../image/search.svg" alt=""></span>
							</button>
						</div>
					</form>
				</div>
			</div>

			<!-- 탭 + 테이블 -->
			<div class="card-panel jw-mgt24">
				<div class="tab-wrap">
					<button type="button" class="tab-btn active" data-tab="all" onclick="switchTab('all')">
						<span>All</span>
						<span class="tab-badge" id="allCount" style="background:#6b7280;">0</span>
					</button>
					<button type="button" class="tab-btn" data-tab="checking" onclick="switchTab('checking')">
						<span>Checking</span>
						<span class="tab-badge" id="checkingCount" style="background:#2563eb;">0</span>
					</button>
					<button type="button" class="tab-btn" data-tab="confirmed" onclick="switchTab('confirmed')">
						<span>Confirmed</span>
						<span class="tab-badge" id="confirmedCount" style="background:#16a34a;">0</span>
					</button>
					<button type="button" class="tab-btn" data-tab="rejected" onclick="switchTab('rejected')">
						<span>Rejected</span>
						<span class="tab-badge" id="rejectedCount" style="background:#dc2626;">0</span>
					</button>
					<button type="button" class="tab-btn" data-tab="pending_payment" onclick="switchTab('pending_payment')">
						<span>Pending Payment</span>
						<span class="tab-badge" id="pendingPaymentCount" style="background:#ea580c;">0</span>
					</button>
				</div>

				<table class="jw-tableA">
					<colgroup>
						<col style="width:40px;"><col style="width:120px;"><col style="width:100px;"><col>
						<col style="width:100px;"><col style="width:100px;"><col style="width:120px;"><col style="width:150px;">
					</colgroup>
					<thead>
						<tr>
							<th class="no is-center">No</th>
							<th class="is-center">Booking ID</th>
							<th class="is-center">Agent</th>
							<th>Product Name</th>
							<th class="is-center">Travel Date</th>
							<th class="is-center">Option Fee</th>
							<th class="is-center">Status</th>
							<th class="is-center">Actions</th>
						</tr>
					</thead>
					<tbody id="tableBody">
						<tr><td colspan="8" class="is-center">Loading...</td></tr>
					</tbody>
				</table>
				<div class="pagination-wrap" id="pagination"></div>
			</div>
		</section>
	</main>

	<!-- 반려 사유 모달 -->
	<div class="modal-overlay" id="rejectModal">
		<div class="modal-box">
			<h3>Reject Option Payment</h3>
			<p style="font-size:14px;color:#6b7280;margin-bottom:12px;">Booking: <strong id="rejectModalBookingId"></strong></p>
			<textarea id="rejectReason" placeholder="Enter rejection reason..."></textarea>
			<div class="modal-actions">
				<button class="jw-button typeD" onclick="closeRejectModal()">Cancel</button>
				<button class="jw-button typeB" style="background:#dc2626;" onclick="submitReject()">Reject</button>
			</div>
		</div>
	</div>

	<script src="../js/default.js"></script>
	<script src="../js/super.js"></script>
	<script src="../js/super-extra-options.js?v=20260212b"></script>
	<script>
		init({
			headerUrl: '../inc/header.html',
			navUrl: '../inc/nav_super.html'
		});
	</script>
</body>

</html>
