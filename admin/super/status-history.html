<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>Status Change History - SMART TRAVEL ADMIN</title>

	<link rel="shortcut icon" href="../image/favicon.ico">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../css/a_reset.css">
	<link rel="stylesheet" href="../css/a_variables.css">
	<link rel="stylesheet" href="../css/a_components.css">
	<link rel="stylesheet" href="../css/a_contents.css">
</head>

<body>

	<header class="layout-header"></header>

	<main class="layout-main">
		<nav class="layout-nav"></nav>

		<section class="layout-content">
			<h1 class="page-title" data-lan-eng="Status Change History">Status Change History</h1>

			<div class="card-panel jw-mgt32">
				<!-- 필터/검색 영역 -->
				<div class="filter-section">
					<form class="filter-form" id="filterForm" onsubmit="event.preventDefault(); applyFilters();">
						<div class="filter-row">
							<!-- 날짜 필터 -->
							<div class="filter-group">
								<label class="filter-label" data-lan-eng="Period">Period</label>
								<div class="date-range">
									<input type="date" id="startDate" class="filter-input date-input">
									<span class="date-separator">~</span>
									<input type="date" id="endDate" class="filter-input date-input">
								</div>
							</div>

							<!-- 상태 필터 -->
							<div class="filter-group">
								<label class="filter-label" data-lan-eng="New Status">New Status</label>
								<select class="filter-select" id="statusFilter">
									<option value="">All Status</option>
									<option value="waiting_down_payment">Waiting for Down Payment</option>
									<option value="checking_down_payment">Checking Down Payment</option>
									<option value="waiting_second_payment">Waiting for Second Payment</option>
									<option value="checking_second_payment">Checking Second Payment</option>
									<option value="waiting_balance">Waiting for Balance</option>
									<option value="checking_balance">Checking Balance</option>
									<option value="waiting_full_payment">Waiting for Full Payment</option>
									<option value="checking_full_payment">Checking Full Payment</option>
									<option value="rejected">Payment Rejected</option>
									<option value="confirmed">Reservation Confirmed</option>
									<option value="completed">Trip Completed</option>
									<option value="cancelled">Reservation Cancelled</option>
									<option value="refunded">Refund Completed</option>
								</select>
							</div>

							<!-- 검색 -->
							<div class="filter-group filter-group-search">
								<label class="filter-label" data-lan-eng="Search">Search</label>
								<div class="search-box">
									<input type="text" class="filter-input search-input" id="searchInput" placeholder="Booking ID or Email" data-lan-eng-placeholder="Booking ID or Email">
									<button type="submit" class="search-btn">
										<img src="../image/search.svg" alt="Search">
									</button>
								</div>
							</div>

							<!-- 초기화 버튼 -->
							<div class="filter-group">
								<label class="filter-label">&nbsp;</label>
								<button type="button" class="reset-btn" onclick="resetFilters()" data-lan-eng="Reset">Reset</button>
							</div>
						</div>
					</form>
				</div>

				<!-- 결과 카운트 -->
				<div class="result-bar">
					<div class="result-count">
						<span data-lan-eng="Search results">Search results</span>
						<strong id="totalCount">0</strong>
						<span data-lan-eng="items">items</span>
					</div>
				</div>

				<!-- 테이블 -->
				<div class="tableA-scroll">
					<table class="jw-tableA">
						<colgroup>
							<col style="width:50px;"> <!-- No -->
							<col style="width:140px;"> <!-- Booking ID -->
							<col style="width:180px;"> <!-- Product Name -->
							<col style="width:100px;"> <!-- Travel Date -->
							<col style="width:140px;"> <!-- Previous Status -->
							<col style="width:140px;"> <!-- New Status -->
							<col style="width:150px;"> <!-- Changed By -->
							<col style="width:140px;"> <!-- Changed At -->
						</colgroup>
						<thead>
							<tr>
								<th class="is-center">No</th>
								<th class="is-center" data-lan-eng="Booking ID">Booking ID</th>
								<th class="is-center" data-lan-eng="Product Name">Product Name</th>
								<th class="is-center" data-lan-eng="Travel Date">Travel Date</th>
								<th class="is-center" data-lan-eng="Previous Status">Previous Status</th>
								<th class="is-center" data-lan-eng="New Status">New Status</th>
								<th class="is-center" data-lan-eng="Changed By">Changed By</th>
								<th class="is-center" data-lan-eng="Changed At">Changed At</th>
							</tr>
						</thead>
						<tbody id="historyTableBody">
							<tr>
								<td colspan="8" class="is-center" style="padding: 40px;">Loading...</td>
							</tr>
						</tbody>
					</table>
				</div>

				<!-- 페이지네이션 -->
				<div class="jw-pagebox" id="pagination" role="navigation">
					<div class="contents">
						<button type="button" class="first" aria-label="First page">
							<img src="../image/double_left.svg" alt="">
						</button>
						<button type="button" class="prev" aria-label="Previous page">
							<img src="../image/arrow4.svg" alt="">
						</button>
						<div class="page" id="pageButtons" role="list"></div>
						<button type="button" class="next" aria-label="Next page">
							<img src="../image/arrow4.svg" alt="" style="transform: rotate(180deg);">
						</button>
						<button type="button" class="last" aria-label="Last page">
							<img src="../image/double_left.svg" alt="" style="transform: rotate(180deg);">
						</button>
					</div>
				</div>
			</div>

			<!-- 액션 버튼 -->
			<div class="controller">
				<button type="button" class="jw-button typeA" id="downloadCsvBtn" data-lan-eng="Download CSV">Download CSV</button>
			</div>

		</section>
	</main>

	<script src="../js/default.js"></script>
	<script src="../js/super.js"></script>

	<script>
		init({
			headerUrl: '../inc/header.html',
			navUrl: '../inc/nav_super.html'
		});

		let currentPage = 1;
		const limit = 20;
		let currentFilters = {
			search: '',
			statusFilter: '',
			startDate: '',
			endDate: ''
		};

		document.addEventListener('DOMContentLoaded', async () => {
			try {
				// 세션 확인
				const sessionResponse = await fetch('../backend/api/check-session.php', {
					credentials: 'same-origin'
				});
				const sessionData = await sessionResponse.json();

				if (!sessionData.authenticated || !['admin_ph', 'admin_kr'].includes(sessionData.userType)) {
					alert('Admin access required.');
					window.location.href = '../index.html';
					return;
				}

				// 필터 이벤트
				document.getElementById('startDate').addEventListener('change', applyFilters);
				document.getElementById('endDate').addEventListener('change', applyFilters);
				document.getElementById('statusFilter').addEventListener('change', applyFilters);

				// 데이터 로드
				await loadData();

				// CSV 다운로드 버튼
				setupDownload();

			} catch (error) {
				console.error('Session check error:', error);
				window.location.href = '../index.html';
			}
		});

		function applyFilters() {
			currentFilters.search = document.getElementById('searchInput').value.trim();
			currentFilters.statusFilter = document.getElementById('statusFilter').value;
			currentFilters.startDate = document.getElementById('startDate').value;
			currentFilters.endDate = document.getElementById('endDate').value;
			currentPage = 1;
			loadData();
		}

		function resetFilters() {
			document.getElementById('searchInput').value = '';
			document.getElementById('statusFilter').value = '';
			document.getElementById('startDate').value = '';
			document.getElementById('endDate').value = '';
			currentFilters = {
				search: '',
				statusFilter: '',
				startDate: '',
				endDate: ''
			};
			currentPage = 1;
			loadData();
		}

		async function loadData(page = currentPage) {
			try {
				const tbody = document.getElementById('historyTableBody');
				if (tbody) {
					tbody.innerHTML = '<tr><td colspan="8" class="is-center" style="padding: 40px;">Loading...</td></tr>';
				}

				const params = new URLSearchParams({
					action: 'getBookingStatusHistory',
					page: page,
					limit: limit
				});

				if (currentFilters.search) params.append('search', currentFilters.search);
				if (currentFilters.statusFilter) params.append('statusFilter', currentFilters.statusFilter);
				if (currentFilters.startDate) params.append('startDate', currentFilters.startDate);
				if (currentFilters.endDate) params.append('endDate', currentFilters.endDate);

				const response = await fetch(`../backend/api/super-api.php?${params.toString()}`, {
					credentials: 'same-origin'
				});

				if (response.status === 401) {
					alert('Login required.');
					window.location.href = '../index.html';
					return;
				}

				if (!response.ok) throw new Error('HTTP ' + response.status);

				const result = await response.json();

				if (result.success && result.data) {
					const { histories, pagination } = result.data;

					// 총 개수 업데이트
					const totalCountEl = document.getElementById('totalCount');
					if (totalCountEl) totalCountEl.textContent = pagination.totalCount || 0;

					// 테이블 렌더링
					if (tbody) {
						if (histories.length === 0) {
							tbody.innerHTML = '<tr><td colspan="8" class="is-center" style="padding: 40px;" data-lan-eng="No status change history found.">No status change history found.</td></tr>';
						} else {
							tbody.innerHTML = histories.map((item) => {
								const bookingLink = `<a href="b2b-booking-detail.html?id=${encodeURIComponent(item.bookingId)}" class="link-primary">${escapeHtml(item.bookingId)}</a>`;

								return `
									<tr>
										<td class="is-center">${item.rowNum}</td>
										<td class="is-center">${bookingLink}</td>
										<td title="${escapeHtml(item.productName || '')}">${escapeHtml(truncateText(item.productName, 25) || '-')}</td>
										<td class="is-center">${escapeHtml(item.travelDate || '-')}</td>
										<td class="is-center">${getStatusBadge(item.previousStatus, item.previousStatusLabel)}</td>
										<td class="is-center">${getStatusBadge(item.newStatus, item.newStatusLabel)}</td>
										<td class="is-center" title="${escapeHtml(item.changedBy || '')}">${escapeHtml(item.changedBy || '-')}<br><small class="text-muted">(${escapeHtml(item.changedByType || '')})</small></td>
										<td class="is-center">${formatDateTime(item.changedAt)}</td>
									</tr>
								`;
							}).join('');
						}
					}

					currentPage = pagination.currentPage;
					renderPagination(pagination);
				} else {
					if (tbody) {
						tbody.innerHTML = `<tr><td colspan="8" class="is-center" style="padding: 40px;">${escapeHtml(result.message || 'Error loading data.')}</td></tr>`;
					}
				}
			} catch (error) {
				console.error('Error loading data:', error);
				const tbody = document.getElementById('historyTableBody');
				if (tbody) {
					tbody.innerHTML = `<tr><td colspan="8" class="is-center" style="padding: 40px;">Error: ${escapeHtml(error.message || 'Unknown error')}</td></tr>`;
				}
			}
		}

		function getStatusBadge(status, label) {
			if (!status) return '<span class="badge badge-secondary">-</span>';

			const statusColors = {
				'pending': 'badge-wait-down',
				'waiting_down_payment': 'badge-wait-down',
				'checking_down_payment': 'badge-check-down',
				'waiting_second_payment': 'badge-wait-second',
				'checking_second_payment': 'badge-check-second',
				'waiting_balance': 'badge-wait-balance',
				'checking_balance': 'badge-check-balance',
				'waiting_full_payment': 'badge-wait-full',
				'checking_full_payment': 'badge-check-full',
				'rejected': 'badge-rejected',
				'confirmed': 'badge-confirmed',
				'completed': 'badge-completed',
				'cancelled': 'badge-cancelled',
				'refunded': 'badge-refunded'
			};

			const colorClass = statusColors[status] || 'badge-secondary';
			return `<span class="badge ${colorClass}">${escapeHtml(label || status)}</span>`;
		}

		function truncateText(text, maxLength) {
			if (!text) return '';
			if (text.length <= maxLength) return text;
			return text.substring(0, maxLength) + '...';
		}

		function renderPagination(pagination) {
			const totalPages = Math.max(1, Number(pagination?.totalPages || 1));
			const current = Math.max(1, Number(pagination?.currentPage || 1));
			const groupSize = 5;
			const groupStart = Math.floor((current - 1) / groupSize) * groupSize + 1;
			const groupEnd = Math.min(totalPages, groupStart + groupSize - 1);

			const pageBox = document.getElementById('pagination');
			const pageWrap = document.getElementById('pageButtons');
			if (!pageBox || !pageWrap) return;

			pageWrap.innerHTML = '';
			for (let p = groupStart; p <= groupEnd; p++) {
				const btn = document.createElement('button');
				btn.type = 'button';
				btn.className = 'p' + (p === current ? ' show' : '');
				btn.setAttribute('role', 'listitem');
				if (p === current) btn.setAttribute('aria-current', 'page');
				btn.textContent = String(p);
				btn.addEventListener('click', () => { currentPage = p; loadData(p); });
				pageWrap.appendChild(btn);
			}

			const firstBtn = pageBox.querySelector('.first');
			const prevBtn = pageBox.querySelector('.prev');
			const nextBtn = pageBox.querySelector('.next');
			const lastBtn = pageBox.querySelector('.last');

			const prevTarget = Math.max(1, groupStart - groupSize);
			const nextTarget = Math.min(totalPages, groupStart + groupSize);

			if (firstBtn) firstBtn.onclick = () => { currentPage = 1; loadData(1); };
			if (lastBtn) lastBtn.onclick = () => { currentPage = totalPages; loadData(totalPages); };
			if (prevBtn) prevBtn.onclick = () => { currentPage = prevTarget; loadData(prevTarget); };
			if (nextBtn) nextBtn.onclick = () => { currentPage = nextTarget; loadData(nextTarget); };
		}

		function setupDownload() {
			const btn = document.getElementById('downloadCsvBtn');
			if (!btn || btn._bound) return;

			btn.addEventListener('click', () => {
				const params = new URLSearchParams({ action: 'exportBookingStatusHistoryCsv' });

				if (currentFilters.search) params.append('search', currentFilters.search);
				if (currentFilters.statusFilter) params.append('statusFilter', currentFilters.statusFilter);
				if (currentFilters.startDate) params.append('startDate', currentFilters.startDate);
				if (currentFilters.endDate) params.append('endDate', currentFilters.endDate);

				window.location.href = `../backend/api/super-api.php?${params.toString()}`;
			});
			btn._bound = true;
		}

		function escapeHtml(text) {
			if (!text) return '';
			const div = document.createElement('div');
			div.textContent = text;
			return div.innerHTML;
		}

		function formatDateTime(dateStr) {
			if (!dateStr) return '-';
			try {
				const date = new Date(dateStr);
				const year = date.getFullYear();
				const month = String(date.getMonth() + 1).padStart(2, '0');
				const day = String(date.getDate()).padStart(2, '0');
				const hour = String(date.getHours()).padStart(2, '0');
				const min = String(date.getMinutes()).padStart(2, '0');
				return `${year}-${month}-${day} ${hour}:${min}`;
			} catch (e) {
				return dateStr;
			}
		}
	</script>

	<style>

		.badge-check-second { background-color: #FFE0B2; color: #BF360C; }   /* Second Payment 확인중 - 주황 */
		.badge-wait-balance { background-color: #F3E5F5; color: #7B1FA2; }   /* Balance 대기 - 연한 보라 */
		.badge-check-balance { background-color: #E1BEE7; color: #4A148C; }  /* Balance 확인중 - 보라 */
