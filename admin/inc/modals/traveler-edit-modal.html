<!-- ==============================================
   Traveler Edit Modal - 공통 모달
   이 파일은 여러 페이지에서 공유됩니다.
   수정 시 모든 페이지에 영향을 미칩니다.
   - create-reservation.html
   - reservation-detail.html
   - b2b-booking-detail.html
   ============================================== -->

<!-- 여행자 정보 입력/편집 모달 -->
<div id="traveler-modal" class="modal" style="display: none;">
	<div class="modal-content modal-traveler">
		<div class="modal-header">
			<h3 data-lan-eng="Traveler Information">Traveler Information</h3>
			<button type="button" class="modal-close" onclick="closeTravelerModal()">
				<img src="../image/button-close2.svg" alt="">
			</button>
		</div>
		<div class="modal-body traveler-modal-body">
			<!-- 왼쪽: 기존 콘텐츠 영역 -->
			<div class="traveler-modal-main">
				<div class="traveler-cards-header">
					<span class="traveler-count" id="traveler-modal-count">0 Travelers</span>
					<div class="traveler-cards-actions">
						<button type="button" class="jw-button typeA" onclick="openTravelCustomerSearchModal()" data-lan-eng="Loading customer information">Loading customer information</button>
						<button type="button" class="jw-button typeA" onclick="addTravelerCard()">+ Add Traveler</button>
					</div>
				</div>
				<div class="traveler-cards-container" id="traveler-cards-container">
					<!-- 여행자 카드가 여기에 동적으로 추가됩니다 -->
				</div>
			</div>
			<!-- 오른쪽: 네비게이션 사이드바 -->
			<div class="traveler-modal-sidebar" id="traveler-modal-sidebar">
				<div class="sidebar-title" data-lan-eng="Travelers">Travelers</div>
				<div class="sidebar-nav-list" id="traveler-sidebar-nav">
					<!-- 여행자 네비게이션 아이템이 여기에 추가됩니다 -->
				</div>
			</div>
		</div>
		<div class="modal-footer">
			<button type="button" class="jw-button typeB" onclick="saveTravelersFromModal()" data-lan-eng="Save">Save</button>
			<button type="button" class="jw-button typeD" onclick="closeTravelerModal()" data-lan-eng="Cancel">Cancel</button>
		</div>
	</div>
</div>

<!-- 여행자 편집 모달 (예약 상세용 - travelerEditAllModal) -->
<div id="travelerEditAllModal" class="modal" style="display:none;">
	<div class="modal-content modal-traveler">
		<div class="modal-header">
			<h3 data-lan-eng="Edit Travelers">Edit Travelers</h3>
			<button type="button" class="modal-close" onclick="closeTravelerEditModal()">
				<img src="../image/button-close2.svg" alt="">
			</button>
		</div>
		<div class="modal-body traveler-modal-body">
			<!-- 왼쪽: 여행자 카드 영역 -->
			<div class="traveler-modal-main">
				<div class="traveler-cards-header">
					<span class="traveler-count" id="traveler-edit-count">0 Travelers</span>
					<div class="traveler-cards-actions">
						<button type="button" class="jw-button typeA" onclick="addTravelerCardInEdit()">+ Add Traveler</button>
					</div>
				</div>
				<div class="traveler-cards-container" id="traveler-edit-cards-container">
					<!-- 여행자 카드가 여기에 동적으로 추가됩니다 -->
				</div>
			</div>
			<!-- 오른쪽: 네비게이션 사이드바 -->
			<div class="traveler-modal-sidebar" id="traveler-edit-modal-sidebar">
				<div class="sidebar-title" data-lan-eng="Travelers">Travelers</div>
				<div class="sidebar-nav-list" id="traveler-edit-sidebar-nav">
					<!-- 여행자 네비게이션 아이템이 여기에 추가됩니다 -->
				</div>
			</div>
		</div>
		<div class="modal-footer">
			<button type="button" class="jw-button typeB" onclick="saveAllTravelers()" data-lan-eng="Next: Room Options">Next: Room Options</button>
			<button type="button" class="jw-button typeD" onclick="closeTravelerEditModal()" data-lan-eng="Cancel">Cancel</button>
		</div>
	</div>
</div>
